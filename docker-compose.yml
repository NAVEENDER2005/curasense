services:
  postgres:
    image: postgres:16-alpine
    container_name: curasense-postgres
    environment:
      POSTGRES_USER: curasense
      POSTGRES_PASSWORD: curasense
      POSTGRES_DB: curasense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curasense"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
